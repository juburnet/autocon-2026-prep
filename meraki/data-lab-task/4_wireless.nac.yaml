
meraki:
  domains:
    - name: US
      organizations:
        - name: !env org_name
          networks:
            - name: !env branch_name
              devices:
                - name: Unified Branch Network Access Point
                  serial: !env branch_cw_serial
                  tags:
                    - autocon
                    - UBAC-S
                  lat: 37.41809510000001
                  lng: -122.098531
                  address: Wake Forest, N.C.
                  notes: Small Branch Notes Access Point 1
              wireless:
                settings:
                  upgrade_strategy: minimizeUpgradeTime
                  meshing: false
                rf_profiles:
                  - name: Corp wireless rf profile
                    band_selection_type: ssid
                    min_bitrate_type: band
                    per_ssid_settings:
                      - ssid_name: Guest
                        band_operation_mode: dual
                        band_steering: true
                        bands:
                          - "2.4"
                          - "5"
                      - ssid_name: Data
                        band_operation_mode: dual
                        band_steering: true
                        bands:
                          - "2.4"
                          - "5"
                    transmission: true
                ssids:
                  - name: Data
                    auth_mode: 8021x-radius
                    available_on_all_aps: true
                    band_selection: Dual band operation with Band Steering
                    default_vlan_id: 10
                    dot11r:
                      enabled: true
                    dot11w:
                      enabled: true
                      required: false
                    enabled: true
                    encryption_mode: wpa-eap
                    firewall_l3_firewall_rules:
                      allow_lan_access: true
                    ip_assignment_mode: Bridge mode
                    lan_isolation: false
                    radius:
                      accounting: true
                      attribute_for_group_policies: Filter-Id
                      coa: false
                      override: true
                      testing: true
                      accounting_servers:
                        - host: 172.16.1.1
                          port: 1813
                          secret: !env radius_accounting_server_secret
                        - host: 172.16.1.2
                          port: 1813
                          secret: !env radius_accounting_server_secret
                      servers:
                        - host: 172.16.1.1
                          port: 1812
                          secret: !env radius_server_secret
                        - host: 172.16.1.2
                          port: 1812
                          secret: !env radius_server_secret
                    unavailability_schedules:
                      enabled: true
                      ranges:
                        - start_day: Sunday
                          start_time: 00:00:00
                          end_time: 06:00:00
                          end_day: Sunday
                        - start_day: Saturday
                          start_time: 00:00:00
                          end_time: 06:00:00
                          end_day: Saturday
                    ssid_number: '4'
                    traffic_shaping_rules:
                      traffic_shaping: true
                      default_rules: true
                    use_vlan_tagging: true
                    visible: true
                    wpa_encryption_mode: WPA3 Transition Mode
                  - name: Guest
                    auth_mode: open
                    available_on_all_aps: true
                    band_selection: Dual band operation
                    default_vlan_id: 50
                    enabled: true
                    firewall_l3_firewall_rules:
                      allow_lan_access: false
                    ip_assignment_mode: Bridge mode
                    lan_isolation: true
                    mandatory_dhcp: true
                    per_client_bandwidth_limit_down: 0
                    per_client_bandwidth_limit_up: 0
                    per_ssid_bandwidth_limit_down: 0
                    per_ssid_bandwidth_limit_up: 0
                    unavailability_schedules:
                      enabled: true
                      ranges:
                        - start_day: Sunday
                          start_time: 00:00:00
                          end_time: 06:00:00
                          end_day: Sunday
                        - start_day: Saturday
                          start_time: 00:00:00
                          end_time: 06:00:00
                          end_day: Saturday
                    splash_page: Click-through splash page
                    splash_settings:
                      welcome_message: Unauthorized access is prohibited.
                    ssid_number: '1'
                    traffic_shaping_rules:
                      traffic_shaping: true
                      default_rules: true
                    use_vlan_tagging: true
                    visible: true
