# ios-xe/.gitlab-ci.yml — child pipeline, triggered by the root .gitlab-ci.yml
# only when ios-xe/data/**/* changes.
#
# Uses netascode/nac-iosxe/iosxe module 1.0.0 (pinned in main.tf), which
# requires image: danischm/nac:0.4.1 — a different image/module pairing
# than meraki/, which is why this lives in its own child pipeline.
#
# Required CI/CD variables (Settings > CI/CD > Variables, masked+protected):
#   IOSXE_USERNAME, IOSXE_PASSWORD
#   GITLAB_TOKEN (optional — enables posting the Terraform plan as an MR
#     comment in the `notify` job; safely no-ops if unset or outside an MR)
#
# State: GitLab-managed remote state via Terraform's `http` backend
# (declared empty in ios-xe/main.tf, configured entirely through the
# TF_HTTP_* variables below — derived from predefined CI/CD variables,
# no extra secrets needed). TF_HTTP_SKIP_CERT_VERIFICATION is "true"
# because this lab's GitLab instance uses a self-signed certificate.
# State is keyed per-branch via TF_STATE_NAME so each branch/MR gets its
# own state instead of sharing one.
#
# Note on rules: this file uses $CI_MERGE_REQUEST_IID (not
# $CI_PIPELINE_SOURCE == "merge_request_event") to detect MR context,
# because child pipelines triggered via `include: local:` always report
# CI_PIPELINE_SOURCE as "parent_pipeline" — only the CI_MERGE_REQUEST_*
# variables carry through from an MR-sourced parent pipeline.

image: danischm/nac:0.4.1

variables:
  TF_IN_AUTOMATION: "true"
  GIT_DEPTH: "0"
  TF_STATE_NAME: "iosxe-${CI_COMMIT_REF_SLUG}"
  TF_HTTP_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
  TF_HTTP_LOCK_ADDRESS: "${TF_HTTP_ADDRESS}/lock"
  TF_HTTP_UNLOCK_ADDRESS: "${TF_HTTP_ADDRESS}/lock"
  TF_HTTP_LOCK_METHOD: "POST"
  TF_HTTP_UNLOCK_METHOD: "DELETE"
  TF_HTTP_USERNAME: "${GITLAB_USER_LOGIN}"
  TF_HTTP_PASSWORD: "${CI_JOB_TOKEN}"
  TF_HTTP_SKIP_CERT_VERIFICATION: "true"

stages:
  - validate
  - plan
  - deploy
  - test
  - notify

.rules_mr_or_main: &rules_mr_or_main
  - if: '$CI_MERGE_REQUEST_IID'
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.rules_main_only: &rules_main_only
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

validate:
  stage: validate
  script:
    - cd ios-xe
    - echo "Checking Terraform formatting..."
    - terraform fmt -check -recursive | tee fmt_output.txt
    - '! grep -qE "\.tf" fmt_output.txt'
    - echo "Generating merged configuration..."
    - terraform init -input=false
    - terraform apply -auto-approve -input=false -target='module.iosxe.local_sensitive_file.model[0]'
    - test -f xe_merged_config.nac.yaml
    - echo "Running nac-validate..."
    - nac-validate ./xe_merged_config.nac.yaml | tee validate_output.txt
    - '! grep -q "ERROR" validate_output.txt'
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - ios-xe/fmt_output.txt
      - ios-xe/validate_output.txt
      - ios-xe/xe_merged_config.nac.yaml

plan:
  stage: plan
  needs: ["validate"]
  rules: *rules_mr_or_main
  script:
    - cd ios-xe
    - terraform init -input=false
    - terraform plan -out=plan.tfplan -input=false
    - terraform show -no-color plan.tfplan > plan.txt
    - terraform show -json plan.tfplan | jq > plan.json
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - ios-xe/plan.tfplan
      - ios-xe/plan.txt
      - ios-xe/plan.json

deploy:
  stage: deploy
  needs: ["plan"]
  rules: *rules_main_only
  script:
    - cd ios-xe
    - terraform init -input=false
    - terraform apply -input=false -auto-approve plan.tfplan

idempotency-test:
  stage: test
  needs: ["deploy"]
  rules: *rules_main_only
  script:
    - cd ios-xe
    - terraform init -input=false
    - echo "Regenerating merged configuration (not preserved in deploy artifacts)..."
    - terraform apply -auto-approve -input=false -target='module.iosxe.local_sensitive_file.model[0]'
    - set +e
    - terraform plan -input=false -out=idempotency.tfplan -detailed-exitcode
    - rc=$?
    - set -e
    - terraform show -no-color idempotency.tfplan > idempotency_plan.txt
    - |
      if [ "$rc" -eq 2 ]; then
        echo "Terraform plan detected changes! Idempotency test failed."
        cat idempotency_plan.txt
        exit 1
      elif [ "$rc" -eq 0 ]; then
        echo "Terraform is idempotent. No changes detected."
      else
        echo "terraform plan failed with exit code $rc"
        exit "$rc"
      fi
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - ios-xe/idempotency_plan.txt
      - ios-xe/idempotency.tfplan

config-test:
  stage: test
  needs: ["deploy"]
  rules: *rules_main_only
  script:
    - cd ios-xe
    - terraform init -input=false
    - echo "Regenerating merged configuration (not preserved in deploy artifacts)..."
    - terraform apply -auto-approve -input=false -target='module.iosxe.local_sensitive_file.model[0]'
    - |
      if [ -d tests/templates ]; then
        sleep 60
        nac-test -d ./xe_merged_config.nac.yaml -t ./tests/templates -o ./tests/results | tee test_output.txt
      else
        echo "No tests/templates directory under ios-xe/ — skipping config test."
      fi
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - ios-xe/tests/results/
      - ios-xe/test_output.txt

notify:
  stage: notify
  needs: ["plan"]
  rules: *rules_mr_or_main
  script:
    - cd ios-xe
    - python3 ../.ci/gitlab-comment.py

rollback:
  stage: .post
  needs: ["deploy"]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_failure
  script:
    - cd ios-xe
    - echo "Deploy failed — destroying Terraform-managed resources to roll back."
    - terraform init -input=false
    - terraform destroy -auto-approve -input=false || true
