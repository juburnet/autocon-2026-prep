
meraki:
  domains:
    - name: US
      organizations:
        - name: !env org_name
          networks:
            - name: Unified Branch 1
              devices:
                - name: Unified Branch Network 1 Switch
                  serial: !env branch1_ms_serial
                  tags:
                    - autocon
                    - UBAC-S
                  lat: 37.41809510000001
                  lng: -122.098531
                  address: Wake Forest, N.C.
                  notes: Small Branch Notes Switch 1
                  switch:
                    ports:
                      - port_id_ranges:
                          - from: 1
                            to: 2
                        name: Uplink Trunk Port
                        enabled: true
                        type: trunk
                        tags:
                          - uplink
                          - trunk
                        vlan: 1
                        allowed_vlans: 1,10,20,30,40,50,999
                        link_negotiation: Auto negotiate
                        udld: Alert only
                        storm_control: true
                        rstp: true
                      - port_id_ranges:
                          - from: 3
                            to: 8
                        name: Reserved for Infrastructure
                        enabled: false
                        type: access
                        tags:
                          - access
                        vlan: 1
                        link_negotiation: Auto negotiate
                        storm_control: true
                        rstp: true
                        stp_guard: bpdu guard
                      - port_id_ranges:
                          - from: 9
                            to: 12
                        name: AP Trunk Port
                        enabled: true
                        type: trunk
                        tags:
                          - uplink
                          - trunk
                        vlan: 999
                        allowed_vlans: 1,10,20,30,40,50,999
                        link_negotiation: Auto negotiate
                        udld: Alert only
                        storm_control: true
                        rstp: true
                      - port_id_ranges:
                          - from: 13
                            to: 24
                        name: Access Port
                        enabled: true
                        type: access
                        tags:
                          - access
                        vlan: 10
                        voice_vlan: 20
                        link_negotiation: Auto negotiate
                        storm_control: true
                        rstp: true
                        stp_guard: bpdu guard
              switch:
                settings:
                  vlan: 999
                  use_combined_power: false
                  uplink_client_sampling: true
                  mac_blocklist: false
                mtu:
                  default_mtu_size: 9176
                routing_multicast:
                  default_settings:
                    igmp_snooping: true
                    flood_unknown_multicast_traffic: false
                dscp_to_cos_mappings:
                  - cos: 0
                    dscp: 0
                    title: default
                  - cos: 0
                    dscp: 10
                    title: AF11
                  - cos: 1
                    dscp: 18
                    title: AF21
                  - cos: 2
                    dscp: 26
                    title: AF31
                  - cos: 3
                    dscp: 34
                    title: AF41
                  - cos: 3
                    dscp: 46
                    title: EF voice
                qos_rules:
                  - vlan: 50
                    protocol: ANY
                    dscp: 0
                    qos_rule_name: Remark_Guest_to_Default
                  - vlan: 10
                    protocol: ANY
                    dscp: -1
                    qos_rule_name: Trust_Data_VLAN
                  - vlan: 20
                    protocol: ANY
                    dscp: -1
                    qos_rule_name: Trust_Voice_VLAN
                  - vlan: 30
                    protocol: ANY
                    dscp: -1
                    qos_rule_name: Trust_IoT_VLAN
                  - vlan: 40
                    protocol: ANY
                    dscp: -1
                    qos_rule_name: Trust_PCI_VLAN
                storm_control:
                  broadcast_threshold: 20
                  multicast_threshold: 30
                  unknown_unicast_threshold: 10
                access_policies:
                  - name: "Wired Access Policy"
                    radius_servers:
                      - host: 172.16.1.1
                        port: 1812
                        secret: !env radius_server_secret
                      - host: 172.16.1.2
                        port: 1812
                        secret: !env radius_server_secret
                    radius_accounting_servers:
                      - host: 172.16.1.1
                        port: 1813
                        secret: !env radius_accounting_server_secret
                      - host: 172.16.1.2
                        port: 1813
                        secret: !env radius_accounting_server_secret
                    radius_accounting: true
                    radius_coa_support: true
                    radius_testing: true
                    radius_group_attribute: ""
                    host_mode: Multi-Auth
                    voice_vlan_clients: true
                    access_policy_type: Hybrid authentication
                    dot1x_control_direction: both
                    url_redirect_walled_garden: false
