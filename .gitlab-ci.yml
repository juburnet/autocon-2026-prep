# .gitlab-ci.yml — autocon-2026-prep
#
# Thin multidomain orchestrator: triggers an independent child pipeline per
# domain (meraki/, ios-xe/) only when that domain's data/ directory changes.
# Each domain gets its own image + module-version pairing, which is why they
# run as separate child pipelines instead of sharing one top-level image:
#   - meraki/.gitlab-ci.yml  -> image: danischm/nac:0.1.6
#   - ios-xe/.gitlab-ci.yml  -> image: danischm/nac:0.4.1
#
# See meraki/.gitlab-ci.yml and ios-xe/.gitlab-ci.yml for required CI/CD
# variables and the validate/plan/deploy/test stage behavior within each.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - deploy-meraki
  - deploy-iosxe

deploy_meraki:
  stage: deploy-meraki
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [meraki/data/**/*]
    - if: '$CI_COMMIT_BRANCH'
      changes: [meraki/data/**/*]
  trigger:
    include:
      - local: meraki/.gitlab-ci.yml
    strategy: depend

deploy_iosxe:
  stage: deploy-iosxe
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [ios-xe/data/**/*]
    - if: '$CI_COMMIT_BRANCH'
      changes: [ios-xe/data/**/*]
  trigger:
    include:
      - local: ios-xe/.gitlab-ci.yml
    strategy: depend
