# .gitlab-ci.yml — autocon-2026-prep
#
# Two independent pipelines living in one file, prefixed `meraki:` / `iosxe:`.
# Each only runs when its own data/ directory changes (native `rules:changes:`,
# no manual diffing needed):
#   - push to main            -> validate, plan, deploy, idempotency, config-test
#   - push to other branches  -> validate only
#   - merge request           -> validate, plan
#
# Required CI/CD variables (Settings > CI/CD > Variables, masked+protected):
#   meraki/: MERAKI_DASHBOARD_API_KEY, org_name, branch1_mx_serial,
#            branch1_ms_serial, branch1_cw_serial, branch2_mx_serial,
#            branch2_ms_serial, branch2_cw_serial, vpn_hub_network_name,
#            local_page_username, local_page_password, snmp_username,
#            snmp_passphrase, v3_auth_pass, v3_priv_pass,
#            radius_server_secret, radius_accounting_server_secret
#            (see meraki/.env.example / root .env.example)
#   ios-xe/: IOSXE_USERNAME, IOSXE_PASSWORD

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

image: danischm/nac:0.1.6

variables:
  TF_IN_AUTOMATION: "true"
  GIT_DEPTH: "0"

stages:
  - validate
  - plan
  - deploy
  - test

# ─────────────────────────────────────────────────────────────────────────
# Meraki jobs
# ─────────────────────────────────────────────────────────────────────────

.meraki_rules_always: &meraki_rules_always
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes: [meraki/data/**/*]
  - if: '$CI_COMMIT_BRANCH'
    changes: [meraki/data/**/*]

.meraki_rules_mr_or_main: &meraki_rules_mr_or_main
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes: [meraki/data/**/*]
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    changes: [meraki/data/**/*]

.meraki_rules_main_only: &meraki_rules_main_only
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    changes: [meraki/data/**/*]

meraki:validate:
  stage: validate
  rules: *meraki_rules_always
  script:
    - cd meraki
    - echo "Checking Terraform formatting..."
    - terraform fmt -check -recursive | tee fmt_output.txt
    - '! grep -qE "\.tf" fmt_output.txt'
    - echo "Generating merged configuration..."
    - terraform init -input=false
    - terraform apply -auto-approve -input=false -target='module.meraki.module.model.local_sensitive_file.model[0]'
    - test -f meraki_merged_configuration.nac.yaml
    - echo "Running nac-validate..."
    - nac-validate ./meraki_merged_configuration.nac.yaml | tee validate_output.txt
    - '! grep -q "ERROR" validate_output.txt'
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - meraki/fmt_output.txt
      - meraki/validate_output.txt
      - meraki/meraki_merged_configuration.nac.yaml

meraki:plan:
  stage: plan
  needs: ["meraki:validate"]
  rules: *meraki_rules_mr_or_main
  cache:
    key: "meraki-tfstate-$CI_COMMIT_REF_SLUG"
    paths:
      - meraki/terraform.tfstate
      - meraki/terraform.tfstate.backup
    policy: pull
  script:
    - cd meraki
    - terraform init -input=false
    - terraform plan -out=plan.tfplan -input=false
    - terraform show -no-color plan.tfplan > plan.txt
    - terraform show -json plan.tfplan | jq > plan.json
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - meraki/plan.tfplan
      - meraki/plan.txt
      - meraki/plan.json
      - meraki/terraform.tfstate
      - meraki/terraform.tfstate.backup

meraki:deploy:
  stage: deploy
  needs: ["meraki:plan"]
  rules: *meraki_rules_main_only
  cache:
    key: "meraki-tfstate-$CI_COMMIT_REF_SLUG"
    paths:
      - meraki/terraform.tfstate
      - meraki/terraform.tfstate.backup
    policy: push
  script:
    - cd meraki
    - terraform init -input=false
    - terraform apply -input=false -auto-approve plan.tfplan
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - meraki/terraform.tfstate
      - meraki/terraform.tfstate.backup

meraki:idempotency-test:
  stage: test
  needs: ["meraki:deploy"]
  rules: *meraki_rules_main_only
  script:
    - cd meraki
    - terraform init -input=false
    - set +e
    - terraform plan -input=false -out=idempotency.tfplan -detailed-exitcode
    - rc=$?
    - set -e
    - terraform show -no-color idempotency.tfplan > idempotency_plan.txt
    - |
      if [ "$rc" -eq 2 ]; then
        echo "Terraform plan detected changes! Idempotency test failed."
        cat idempotency_plan.txt
        exit 1
      elif [ "$rc" -eq 0 ]; then
        echo "Terraform is idempotent. No changes detected."
      else
        echo "terraform plan failed with exit code $rc"
        exit "$rc"
      fi
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - meraki/idempotency_plan.txt
      - meraki/idempotency.tfplan

meraki:config-test:
  stage: test
  needs: ["meraki:deploy"]
  rules: *meraki_rules_main_only
  script:
    - cd meraki
    - |
      if [ -d tests/templates ]; then
        sleep 60
        nac-test -d ./meraki_merged_configuration.nac.yaml -t ./tests/templates -o ./tests/results | tee test_output.txt
      else
        echo "No tests/templates directory under meraki/ — skipping config test."
      fi
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - meraki/tests/results/
      - meraki/test_output.txt

meraki:rollback:
  stage: .post
  needs: ["meraki:deploy"]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: [meraki/data/**/*]
      when: on_failure
  script:
    - cd meraki
    - echo "Deploy failed — destroying Terraform-managed resources to roll back."
    - terraform init -input=false
    - terraform destroy -auto-approve -input=false || true

# ─────────────────────────────────────────────────────────────────────────
# IOS-XE jobs
# ─────────────────────────────────────────────────────────────────────────

