<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <!-- This file is referenced from Markdown via <img src>, so the page's CSS
       and webfonts do not reach it and the accessibility markup below is not
       exposed to screen readers - the img alt attribute is the accessible
       name. title/desc/role are kept as documentation for anyone editing this
       file, and would become live if the SVG were ever inlined.
       Roboto leads the font stack to match the Material theme where it is
       installed locally; Helvetica/Arial are the practical fallbacks.
       The backdrop rect below uses rx="8" to match the border-radius that
       docs/stylesheets/extra.css applies to content images - a larger radius
       leaves the page background visible in the corners. -->
  <title id="t">Part 1 - Meraki lab overview</title>
  <desc id="d">Six steps build a single-branch Meraki network from YAML files, which the Network as Code Terraform module and the Meraki provider push to the Dashboard, then validate and test.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#02C8FF"/></marker>
  </defs>
  <rect width="1200" height="700" rx="8" fill="#07182D"/>
  <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Part 1 - Meraki: lab overview</text>
  <text x="600" y="76" text-anchor="middle" font-size="16" fill="#9fb4cc">You write YAML. Network as Code turns it into a Meraki branch network.</text>

  <!-- flow -->
  <g font-size="15" text-anchor="middle">
    <rect x="40" y="105" width="190" height="96" rx="10" fill="#12304f" stroke="#02C8FF"/>
    <text x="135" y="135" font-weight="700" fill="#fff">Intent (you)</text>
    <text x="135" y="158" fill="#cfe3f7">data/*.nac.yaml</text>
    <text x="135" y="180" fill="#cfe3f7">declarative YAML</text>
    <rect x="268" y="105" width="190" height="96" rx="10" fill="#12304f" stroke="#02C8FF"/>
    <text x="363" y="135" font-weight="700" fill="#fff">NaC module</text>
    <text x="363" y="158" fill="#cfe3f7">terraform-meraki-nac-</text>
    <text x="363" y="180" fill="#cfe3f7">meraki: merges by name</text>
    <rect x="496" y="105" width="190" height="96" rx="10" fill="#12304f" stroke="#02C8FF"/>
    <text x="591" y="135" font-weight="700" fill="#fff">Provider</text>
    <text x="591" y="158" fill="#cfe3f7">CiscoDevNet/meraki</text>
    <text x="591" y="180" fill="#cfe3f7">plan, diff, converge</text>
    <rect x="724" y="105" width="190" height="96" rx="10" fill="#12304f" stroke="#02C8FF"/>
    <text x="819" y="135" font-weight="700" fill="#fff">Transport</text>
    <text x="819" y="158" fill="#cfe3f7">HTTPS / REST to the</text>
    <text x="819" y="180" fill="#cfe3f7">Meraki Dashboard API</text>
    <rect x="952" y="105" width="208" height="96" rx="10" fill="#12304f" stroke="#02C8FF"/>
    <text x="1056" y="135" font-weight="700" fill="#fff">Your branch network</text>
    <text x="1056" y="158" fill="#cfe3f7">MX appliance, MS switch,</text>
    <text x="1056" y="180" fill="#cfe3f7">CW access point</text>
  </g>
  <g stroke="#02C8FF" stroke-width="2.5" marker-end="url(#a)">
    <line x1="230" y1="153" x2="266" y2="153"/><line x1="458" y1="153" x2="494" y2="153"/>
    <line x1="686" y1="153" x2="722" y2="153"/><line x1="914" y1="153" x2="950" y2="153"/>
  </g>

  <!-- steps -->
  <text x="40" y="250" font-size="18" font-weight="700" fill="#02C8FF">Build it in six steps (move each file from data-lab-task/ into data/ as you go)</text>
  <g font-size="14">
    <g>
      <rect x="40" y="268" width="176" height="170" rx="10" fill="#0f2742" stroke="#2a4a6e"/>
      <circle cx="68" cy="296" r="15" fill="#FF9000"/><text x="68" y="301" text-anchor="middle" font-weight="700" fill="#07182D">1</text>
      <text x="92" y="301" font-weight="700" fill="#fff">Log in</text>
      <text x="54" y="332" fill="#cfe3f7">Sign in to Dashboard</text>
      <text x="54" y="352" fill="#cfe3f7">and find your lab</text>
      <text x="54" y="372" fill="#cfe3f7">organization</text>
      <text x="54" y="410" fill="#9fb4cc" font-size="12">Org-[org_id]</text>
    </g>
    <g>
      <rect x="226" y="268" width="176" height="170" rx="10" fill="#0f2742" stroke="#2a4a6e"/>
      <circle cx="254" cy="296" r="15" fill="#02C8FF"/><text x="254" y="301" text-anchor="middle" font-weight="700" fill="#07182D">2</text>
      <text x="278" y="301" font-weight="700" fill="#fff">Org and global</text>
      <text x="240" y="332" fill="#cfe3f7">Admin, SNMPv3, login</text>
      <text x="240" y="352" fill="#cfe3f7">security, org-wide VPN</text>
      <text x="240" y="372" fill="#cfe3f7">firewall rules</text>
      <text x="240" y="410" fill="#9fb4cc" font-size="12">1_org_global.nac.yaml</text>
    </g>
    <g>
      <rect x="412" y="268" width="176" height="170" rx="10" fill="#0f2742" stroke="#2a4a6e"/>
      <circle cx="440" cy="296" r="15" fill="#02C8FF"/><text x="440" y="301" text-anchor="middle" font-weight="700" fill="#07182D">3</text>
      <text x="464" y="301" font-weight="700" fill="#fff">Networks + MX</text>
      <text x="426" y="332" fill="#cfe3f7">Branch network, VLANs,</text>
      <text x="426" y="352" fill="#cfe3f7">site-to-site VPN, traffic</text>
      <text x="426" y="372" fill="#cfe3f7">shaping. Run nac-test.</text>
      <text x="426" y="410" fill="#9fb4cc" font-size="12">2_networks.nac.yaml</text>
    </g>
    <g>
      <rect x="598" y="268" width="176" height="170" rx="10" fill="#0f2742" stroke="#2a4a6e"/>
      <circle cx="626" cy="296" r="15" fill="#02C8FF"/><text x="626" y="301" text-anchor="middle" font-weight="700" fill="#07182D">4</text>
      <text x="650" y="301" font-weight="700" fill="#fff">Switching</text>
      <text x="612" y="332" fill="#cfe3f7">MS switch ports, QoS,</text>
      <text x="612" y="352" fill="#cfe3f7">storm control, 802.1X</text>
      <text x="612" y="372" fill="#cfe3f7">access policy</text>
      <text x="612" y="410" fill="#9fb4cc" font-size="12">3_switching.nac.yaml</text>
    </g>
    <g>
      <rect x="784" y="268" width="176" height="170" rx="10" fill="#0f2742" stroke="#2a4a6e"/>
      <circle cx="812" cy="296" r="15" fill="#02C8FF"/><text x="812" y="301" text-anchor="middle" font-weight="700" fill="#07182D">5</text>
      <text x="836" y="301" font-weight="700" fill="#fff">Wireless</text>
      <text x="798" y="332" fill="#cfe3f7">CW access point, RF</text>
      <text x="798" y="352" fill="#cfe3f7">profile, Data and Guest</text>
      <text x="798" y="372" fill="#cfe3f7">SSIDs</text>
      <text x="798" y="410" fill="#9fb4cc" font-size="12">4_wireless.nac.yaml</text>
    </g>
    <g>
      <rect x="970" y="268" width="190" height="170" rx="10" fill="#0f2742" stroke="#2a4a6e"/>
      <circle cx="998" cy="296" r="15" fill="#02C8FF"/><text x="998" y="301" text-anchor="middle" font-weight="700" fill="#07182D">6</text>
      <text x="1022" y="301" font-weight="700" fill="#fff">Templates</text>
      <text x="984" y="332" fill="#cfe3f7">Define firewall rules once,</text>
      <text x="984" y="352" fill="#cfe3f7">apply by reference to the</text>
      <text x="984" y="372" fill="#cfe3f7">network (capstone)</text>
      <text x="984" y="410" fill="#9fb4cc" font-size="12">5_appliance_*.nac.yaml</text>
    </g>
  </g>

  <!-- loop -->
  <text x="40" y="490" font-size="18" font-weight="700" fill="#02C8FF">At each step, run the same loop</text>
  <g font-size="15" text-anchor="middle">
    <rect x="40" y="508" width="210" height="64" rx="10" fill="#12304f" stroke="#02C8FF"/>
    <text x="145" y="534" font-weight="700" fill="#fff">Move file into data/</text><text x="145" y="556" fill="#cfe3f7">edit the YAML</text>
    <rect x="300" y="508" width="210" height="64" rx="10" fill="#12304f" stroke="#02C8FF"/>
    <text x="405" y="534" font-weight="700" fill="#fff">Validate</text><text x="405" y="556" fill="#cfe3f7">nac-validate (schema, rules)</text>
    <rect x="560" y="508" width="210" height="64" rx="10" fill="#12304f" stroke="#02C8FF"/>
    <text x="665" y="534" font-weight="700" fill="#fff">terraform plan</text><text x="665" y="556" fill="#cfe3f7">review what will change</text>
    <rect x="820" y="508" width="150" height="64" rx="10" fill="#12304f" stroke="#02C8FF"/>
    <text x="895" y="534" font-weight="700" fill="#fff">terraform apply</text><text x="895" y="556" fill="#cfe3f7">push to Dashboard</text>
    <rect x="1020" y="508" width="140" height="64" rx="10" fill="#12304f" stroke="#02C8FF"/>
    <text x="1090" y="534" font-weight="700" fill="#fff">nac-test</text><text x="1090" y="556" fill="#cfe3f7">verify the result</text>
  </g>
  <g stroke="#02C8FF" stroke-width="2.5" marker-end="url(#a)">
    <line x1="250" y1="540" x2="298" y2="540"/><line x1="510" y1="540" x2="558" y2="540"/>
    <line x1="770" y1="540" x2="818" y2="540"/><line x1="970" y1="540" x2="1018" y2="540"/>
  </g>

  <!-- footer -->
  <rect x="40" y="600" width="1120" height="68" rx="10" fill="#0f2742" stroke="#2a4a6e"/>
  <text x="60" y="628" font-size="15" fill="#fff"><tspan font-weight="700" fill="#FF9000">Good to know: </tspan>One Meraki org is shared by two participants. Each of you configures one network, so make branch_name unique.</text>
  <text x="60" y="652" font-size="15" fill="#cfe3f7">File number prefixes are a reading order. Terraform builds its own dependency graph from the merged model.</text>
</svg>
